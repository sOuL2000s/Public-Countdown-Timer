<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eternal Countdown · Live Timers</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeDown 0.8s ease;
    }

    .header h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      color: white;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .header h1 span {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: rgba(255, 255, 255, 0.85);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 400;
      letter-spacing: 0.3px;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      display: inline-block;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 2rem;
      margin-bottom: 3rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
      animation: fadeUp 0.8s ease 0.2s both;
    }

    .form-title {
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .form-title .icon {
      font-size: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea {
      padding: 0.8rem 1rem;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #f093fb;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 4px rgba(240, 147, 251, 0.2);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .time-inputs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
      .time-inputs {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      .time-inputs {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .time-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .time-unit input {
      width: 100%;
      padding: 0.5rem;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .time-unit input:focus {
      outline: none;
      border-color: #f093fb;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 4px rgba(240, 147, 251, 0.2);
    }

    .time-unit input[type="number"]::-webkit-inner-spin-button,
    .time-unit input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .time-unit input[type="number"] {
      -moz-appearance: textfield;
    }

    .time-unit label {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .submit-btn {
      grid-column: 1 / -1;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-family: 'Inter', sans-serif;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(245, 87, 108, 0.3);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .timers-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .timers-header h2 {
      color: white;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 700;
    }

    .timers-header .count {
      background: rgba(255, 255, 255, 0.15);
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      animation: fadeUp 0.8s ease 0.4s both;
    }

    @media (max-width: 768px) {
      .timer-grid {
        grid-template-columns: 1fr;
      }
    }

    .timer-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
      animation: fadeScale 0.5s ease forwards;
    }

    .timer-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .timer-name {
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .timer-name .id {
      font-size: 0.7rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.05);
      padding: 0.1rem 0.5rem;
      border-radius: 20px;
    }

    .timer-description {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      padding-left: 0.5rem;
      border-left: 3px solid #f093fb;
      padding-left: 0.75rem;
    }

    .timer-display {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      padding: 1rem;
      text-align: center;
      margin: 0.5rem 0 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-display .time {
      font-family: 'Inter', monospace;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 800;
      color: white;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: all 0.3s ease;
    }

    .timer-display .time.finished {
      background: linear-gradient(135deg, #a8a8a8 0%, #6c6c6c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .timer-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.75rem;
    }

    .timer-meta .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.8rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .timer-meta .status.active {
      background: rgba(52, 211, 153, 0.2);
      color: #6ee7b7;
    }

    .timer-meta .status.finished {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .timer-meta .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .timer-meta .status.active .dot {
      background: #6ee7b7;
    }

    .timer-meta .status.finished .dot {
      background: #f87171;
      animation: none;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: rgba(255, 255, 255, 0.6);
      grid-column: 1 / -1;
    }

    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: block;
    }

    .empty-state h3 {
      color: white;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      max-width: 400px;
      font-weight: 500;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: rgba(52, 211, 153, 0.3);
    }

    .toast.info {
      border-color: rgba(96, 165, 250, 0.3);
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeScale {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(0.8);
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .loading-shimmer {
      background: linear-gradient(90deg, 
        rgba(255, 255, 255, 0.05) 25%, 
        rgba(255, 255, 255, 0.1) 50%, 
        rgba(255, 255, 255, 0.05) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      grid-column: 1 / -1;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>⏳ <span>Eternal Countdown</span></h1>
      <p>🌐 Public · Real-time · Auto-cleanup</p>
    </header>

    <div class="form-card">
      <div class="form-title">
        <span class="icon">🚀</span>
        Create New Timer
      </div>
      <form id="timerForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="timerName">Timer Name *</label>
            <input type="text" id="timerName" placeholder="e.g. New Year 2026" required />
          </div>
          <div class="form-group">
            <label for="timerDesc">Description</label>
            <textarea id="timerDesc" placeholder="What are you counting down to?"></textarea>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>Duration</label>
            <div class="time-inputs">
              <div class="time-unit">
                <input type="number" id="years" min="0" value="0" step="1" />
                <label>Years</label>
              </div>
              <div class="time-unit">
                <input type="number" id="months" min="0" value="0" step="1" />
                <label>Months</label>
              </div>
              <div class="time-unit">
                <input type="number" id="days" min="0" value="0" step="1" />
                <label>Days</label>
              </div>
              <div class="time-unit">
                <input type="number" id="hours" min="0" value="0" step="1" />
                <label>Hours</label>
              </div>
              <div class="time-unit">
                <input type="number" id="minutes" min="0" value="0" step="1" />
                <label>Minutes</label>
              </div>
              <div class="time-unit">
                <input type="number" id="seconds" min="0" value="0" step="1" />
                <label>Seconds</label>
              </div>
            </div>
          </div>
          <button type="submit" class="submit-btn" id="submitBtn">
            <span>▶</span> Start Timer
          </button>
        </div>
      </form>
    </div>

    <div>
      <div class="timers-header">
        <h2>⏲️ Active Timers</h2>
        <span class="count" id="timerCount">0 active</span>
      </div>
      <div id="timerContainer" class="timer-grid">
        <div class="loading-shimmer">⏳ Loading timers...</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Configuration
    const API_BASE = window.location.origin + '/api';
    let refreshInterval;
    let cleanupInterval;
    let timersData = [];
    let timerUpdateInterval;

    // Toast notification
    function showToast(message, type = 'info', duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    // Format remaining time
    function formatRemaining(ms) {
      if (ms <= 0) return '⏳ 0s';
      const totalSeconds = Math.floor(ms / 1000);
      const years = Math.floor(totalSeconds / (365.25 * 24 * 60 * 60));
      let rest = totalSeconds - years * 365.25 * 24 * 60 * 60;
      const months = Math.floor(rest / (30.44 * 24 * 60 * 60));
      rest -= months * 30.44 * 24 * 60 * 60;
      const days = Math.floor(rest / (24 * 60 * 60));
      rest -= days * 24 * 60 * 60;
      const hours = Math.floor(rest / (60 * 60));
      rest -= hours * 60 * 60;
      const minutes = Math.floor(rest / 60);
      const seconds = rest % 60;

      const parts = [];
      if (years) parts.push(`${years}y`);
      if (months) parts.push(`${months}mo`);
      if (days) parts.push(`${days}d`);
      if (hours) parts.push(`${hours}h`);
      if (minutes) parts.push(`${minutes}m`);
      if (seconds || parts.length === 0) parts.push(`${seconds}s`);
      return parts.join(' ');
    }

    // Get remaining milliseconds
    function getRemainingMs(timer) {
      const now = Date.now();
      const elapsed = now - timer.startTime;
      let totalMs = 0;
      if (timer.years) totalMs += timer.years * 365.25 * 24 * 60 * 60 * 1000;
      if (timer.months) totalMs += timer.months * 30.44 * 24 * 60 * 60 * 1000;
      if (timer.days) totalMs += timer.days * 24 * 60 * 60 * 1000;
      if (timer.hours) totalMs += timer.hours * 60 * 60 * 1000;
      if (timer.minutes) totalMs += timer.minutes * 60 * 1000;
      if (timer.seconds) totalMs += timer.seconds * 1000;
      const remaining = totalMs - elapsed;
      return remaining < 0 ? 0 : remaining;
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Fetch timers from API
    async function fetchTimers() {
      try {
        const response = await fetch(`${API_BASE}/timers`);
        if (!response.ok) throw new Error('Failed to fetch timers');
        return await response.json();
      } catch (error) {
        console.error('Error fetching timers:', error);
        return [];
      }
    }

    // Create timer
    async function createTimer(timerData) {
      try {
        const response = await fetch(`${API_BASE}/create-timer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(timerData),
        });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to create timer');
        }
        return await response.json();
      } catch (error) {
        console.error('Error creating timer:', error);
        throw error;
      }
    }

    // Cleanup finished timers
    async function cleanupFinishedTimers() {
      try {
        const response = await fetch(`${API_BASE}/cleanup`, {
          method: 'DELETE',
        });
        if (!response.ok) {
          console.error('Cleanup failed:', await response.text());
          return;
        }
        const result = await response.json();
        if (result.deletedCount > 0) {
          showToast(`🗑️ Removed ${result.deletedCount} finished timer${result.deletedCount > 1 ? 's' : ''}`, 'info');
        }
        return result;
      } catch (error) {
        console.error('Error during cleanup:', error);
      }
    }

    // Render timers from cached data
    function renderTimers() {
      const container = document.getElementById('timerContainer');
      const countSpan = document.getElementById('timerCount');

      if (!container) return;

      // Filter out finished timers (they'll be cleaned up by the server)
      const activeTimers = timersData.filter(timer => {
        const remaining = getRemainingMs(timer);
        return remaining > 0;
      });

      if (activeTimers.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="icon">⏳</span>
            <h3>No Active Timers</h3>
            <p style="color: rgba(255,255,255,0.5);">Start the first timer above!</p>
          </div>
        `;
        if (countSpan) countSpan.textContent = '0 active';
        return;
      }

      const sorted = [...activeTimers].sort((a, b) => b.startTime - a.startTime);
      let html = '';

      for (const timer of sorted) {
        const remainingMs = getRemainingMs(timer);
        const display = formatRemaining(remainingMs);
        const isFinished = remainingMs <= 0;
        const statusClass = isFinished ? 'finished' : 'active';
        const statusText = isFinished ? 'Finished' : 'Counting Down';

        html += `
          <div class="timer-card" data-timer-id="${timer._id}">
            <div class="timer-name">
              ${escapeHtml(timer.name)}
              <span class="id">#${timer._id?.slice(-6) || '??'}</span>
            </div>
            ${timer.description ? `<div class="timer-description">${escapeHtml(timer.description)}</div>` : ''}
            <div class="timer-display">
              <div class="time ${isFinished ? 'finished' : ''}" id="time-${timer._id}">${display}</div>
            </div>
            <div class="timer-meta">
              <span class="status ${statusClass}">
                <span class="dot"></span>
                ${statusText}
              </span>
              <span>${new Date(timer.startTime).toLocaleDateString()}</span>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
      if (countSpan) countSpan.textContent = `${activeTimers.length} active`;
    }

    // Update timer displays in real-time
    function updateTimersRealtime() {
      const timerCards = document.querySelectorAll('.timer-card');
      timerCards.forEach(card => {
        const timerId = card.dataset.timerId;
        const timer = timersData.find(t => t._id === timerId);
        if (timer) {
          const remainingMs = getRemainingMs(timer);
          const display = formatRemaining(remainingMs);
          const timeElement = document.getElementById(`time-${timerId}`);
          if (timeElement) {
            timeElement.textContent = display;
            // Update status if finished
            if (remainingMs <= 0 && !timeElement.classList.contains('finished')) {
              timeElement.classList.add('finished');
              const status = card.querySelector('.status');
              if (status) {
                status.className = 'status finished';
                status.innerHTML = '<span class="dot"></span> Finished';
              }
            }
          }
        }
      });
    }

    // Refresh timers from server
    async function refreshTimers() {
      try {
        const newTimers = await fetchTimers();
        timersData = newTimers;
        renderTimers();
      } catch (error) {
        console.error('Error refreshing timers:', error);
      }
    }

    // Handle form submission
    async function handleSubmit(e) {
      e.preventDefault();

      const nameInput = document.getElementById('timerName');
      const descInput = document.getElementById('timerDesc');
      const submitBtn = document.getElementById('submitBtn');

      const name = nameInput.value.trim();
      if (!name) {
        showToast('Please provide a timer name.', 'info');
        return;
      }

      const years = parseInt(document.getElementById('years').value, 10) || 0;
      const months = parseInt(document.getElementById('months').value, 10) || 0;
      const days = parseInt(document.getElementById('days').value, 10) || 0;
      const hours = parseInt(document.getElementById('hours').value, 10) || 0;
      const minutes = parseInt(document.getElementById('minutes').value, 10) || 0;
      const seconds = parseInt(document.getElementById('seconds').value, 10) || 0;

      const total = years + months + days + hours + minutes + seconds;
      if (total <= 0) {
        showToast('Please set a duration greater than 0.', 'info');
        return;
      }

      const timerData = {
        name,
        description: descInput.value.trim() || '',
        startTime: Date.now(),
        years,
        months,
        days,
        hours,
        minutes,
        seconds,
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>⏳</span> Starting...';

      try {
        await createTimer(timerData);

        // Reset form
        nameInput.value = '';
        descInput.value = '';
        document.getElementById('years').value = 0;
        document.getElementById('months').value = 0;
        document.getElementById('days').value = 0;
        document.getElementById('hours').value = 0;
        document.getElementById('minutes').value = 0;
        document.getElementById('seconds').value = 0;

        showToast('✅ Timer started successfully!', 'success');
        await refreshTimers();
      } catch (error) {
        showToast('Failed to create timer: ' + error.message, 'info');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>▶</span> Start Timer';
      }
    }

    // Start auto-refresh and cleanup
    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      if (cleanupInterval) clearInterval(cleanupInterval);
      if (timerUpdateInterval) clearInterval(timerUpdateInterval);

      // Refresh timers from server every 5 seconds
      refreshInterval = setInterval(refreshTimers, 5000);

      // Update timer displays every second (real-time countdown)
      timerUpdateInterval = setInterval(updateTimersRealtime, 1000);

      // Run cleanup every 10 seconds
      cleanupInterval = setInterval(async () => {
        await cleanupFinishedTimers();
        await refreshTimers();
      }, 10000);
    }

    // Init
    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('timerForm');
      form.addEventListener('submit', handleSubmit);

      await refreshTimers();
      startAutoRefresh();

      // Initial cleanup on load
      setTimeout(async () => {
        await cleanupFinishedTimers();
        await refreshTimers();
      }, 1000);
    });
  </script>
</body>
</html>
