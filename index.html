<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eternal Countdown · Diamond Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Diamond Pattern Background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 20px,
          rgba(212, 175, 55, 0.02) 20px,
          rgba(212, 175, 55, 0.02) 21px
        ),
        repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 20px,
          rgba(212, 175, 55, 0.02) 20px,
          rgba(212, 175, 55, 0.02) 21px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* Gold Glow Effect */
    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(212, 175, 55, 0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: glowPulse 4s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% {
        opacity: 0.5;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeDown 0.8s ease;
    }

    .header .logo-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.3));
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #d4af37 0%, #f5e6b8 30%, #d4af37 60%, #b8960f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      position: relative;
    }

    .header h1::after {
      content: '◆';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: #d4af37;
      -webkit-text-fill-color: #d4af37;
      opacity: 0.5;
    }

    .header p {
      color: rgba(212, 175, 55, 0.7);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 300;
      letter-spacing: 0.3px;
      backdrop-filter: blur(10px);
      background: rgba(212, 175, 55, 0.05);
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      display: inline-block;
      border: 1px solid rgba(212, 175, 55, 0.1);
      margin-top: 0.5rem;
    }

    /* Form Card */
    .form-card {
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2.5rem;
      margin-bottom: 3rem;
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(212, 175, 55, 0.1),
        0 0 40px rgba(212, 175, 55, 0.05);
      animation: fadeUp 0.8s ease 0.2s both;
      position: relative;
      overflow: hidden;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(212, 175, 55, 0.02) 10deg,
        transparent 20deg
      );
      pointer-events: none;
      animation: rotate 60s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .form-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(212, 175, 55, 0.02) 100%);
      pointer-events: none;
    }

    .form-title {
      color: #d4af37;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: relative;
      z-index: 1;
    }

    .form-title .icon {
      font-size: 2rem;
    }

    .form-title .diamond {
      color: #d4af37;
      font-size: 1.2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      color: rgba(212, 175, 55, 0.7);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea {
      padding: 0.8rem 1rem;
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.5);
      color: #e8e0d0;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .form-group input[type="datetime-local"] {
      color-scheme: dark;
    }

    .form-group input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(212, 175, 55, 0.2);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #d4af37;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.05), inset 0 0 20px rgba(212, 175, 55, 0.05);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .mode-selector {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .mode-selector label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(212, 175, 55, 0.6);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0.4rem 1.2rem;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(212, 175, 55, 0.1);
      transition: all 0.3s ease;
    }

    .mode-selector label:hover {
      background: rgba(212, 175, 55, 0.05);
      border-color: rgba(212, 175, 55, 0.2);
    }

    .mode-selector input[type="radio"] {
      display: none;
    }

    .mode-selector input[type="radio"]:checked + label {
      border-color: #d4af37;
      background: rgba(212, 175, 55, 0.08);
      color: #d4af37;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
    }

    .mode-selector label .icon {
      font-size: 1.2rem;
    }

    .time-inputs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
      .time-inputs {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      .time-inputs {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .time-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .time-unit input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.5);
      color: #d4af37;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: center;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .time-unit input:focus {
      outline: none;
      border-color: #d4af37;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.05);
    }

    .time-unit input[type="number"]::-webkit-inner-spin-button,
    .time-unit input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .time-unit input[type="number"] {
      -moz-appearance: textfield;
    }

    .time-unit label {
      color: rgba(212, 175, 55, 0.4);
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .submit-btn {
      grid-column: 1 / -1;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #d4af37 0%, #b8960f 50%, #d4af37 100%);
      border: none;
      border-radius: 12px;
      color: #0a0a0a;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.1) 10deg,
        transparent 20deg
      );
      animation: rotate 10s linear infinite;
    }

    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 20px 40px rgba(212, 175, 55, 0.2), 0 0 60px rgba(212, 175, 55, 0.1);
    }

    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .submit-btn span {
      position: relative;
      z-index: 1;
    }

    /* Timers Header */
    .timers-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .timers-header h2 {
      color: #d4af37;
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .timers-header .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .timers-header .count {
      background: rgba(212, 175, 55, 0.05);
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      color: #d4af37;
      font-weight: 600;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.1);
      font-size: 0.9rem;
    }

    .refresh-btn {
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.1);
      color: #d4af37;
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }

    .refresh-btn:hover:not(:disabled) {
      background: rgba(212, 175, 55, 0.1);
      border-color: rgba(212, 175, 55, 0.3);
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
    }

    .refresh-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .refresh-btn .icon {
      font-size: 1.1rem;
      transition: transform 0.3s ease;
    }

    .refresh-btn.spinning .icon {
      animation: spin 0.8s ease;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Timer Grid */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
      animation: fadeUp 0.8s ease 0.4s both;
    }

    @media (max-width: 768px) {
      .timer-grid {
        grid-template-columns: 1fr;
      }
    }

    .timer-card {
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid rgba(212, 175, 55, 0.08);
      transition: all 0.3s ease;
      animation: fadeScale 0.5s ease forwards;
      position: relative;
      overflow: hidden;
    }

    .timer-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 30px,
        rgba(212, 175, 55, 0.02) 30px,
        rgba(212, 175, 55, 0.02) 31px
      );
      pointer-events: none;
      opacity: 0.5;
    }

    .timer-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      opacity: 0.3;
    }

    .timer-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 60px rgba(212, 175, 55, 0.03);
    }

    .timer-name {
      color: #f5e6b8;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .timer-name .id {
      font-size: 0.6rem;
      font-weight: 400;
      color: rgba(212, 175, 55, 0.3);
      background: rgba(212, 175, 55, 0.05);
      padding: 0.1rem 0.5rem;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.05);
    }

    .timer-description {
      color: rgba(212, 175, 55, 0.4);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      padding-left: 0.5rem;
      border-left: 2px solid #d4af37;
      padding-left: 0.75rem;
      position: relative;
      z-index: 1;
    }

    .timer-display {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      margin: 0.5rem 0 1rem;
      border: 1px solid rgba(212, 175, 55, 0.05);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .timer-display .time {
      font-family: 'Inter', monospace;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      font-weight: 800;
      color: #d4af37;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
    }

    .timer-display .time.finished {
      color: rgba(212, 175, 55, 0.3);
      text-shadow: none;
    }

    .timer-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: rgba(212, 175, 55, 0.3);
      border-top: 1px solid rgba(212, 175, 55, 0.05);
      padding-top: 0.75rem;
      position: relative;
      z-index: 1;
    }

    .timer-meta .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.8rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.7rem;
    }

    .timer-meta .status.active {
      background: rgba(212, 175, 55, 0.05);
      color: #d4af37;
    }

    .timer-meta .status.finished {
      background: rgba(212, 175, 55, 0.02);
      color: rgba(212, 175, 55, 0.2);
    }

    .timer-meta .status .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .timer-meta .status.active .dot {
      background: #d4af37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    .timer-meta .status.finished .dot {
      background: rgba(212, 175, 55, 0.2);
      animation: none;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: rgba(212, 175, 55, 0.2);
      grid-column: 1 / -1;
    }

    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: block;
      opacity: 0.3;
    }

    .empty-state h3 {
      color: rgba(212, 175, 55, 0.4);
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: rgba(212, 175, 55, 0.15);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #e8e0d0;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.1);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 9999;
      max-width: 400px;
      font-weight: 500;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      border-color: rgba(212, 175, 55, 0.2);
    }

    .toast.info {
      border-color: rgba(212, 175, 55, 0.1);
    }

    /* Animations */
    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeScale {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.3;
        transform: scale(0.8);
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(10, 10, 10, 0.5);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.2);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.3);
    }

    .loading-shimmer {
      background: linear-gradient(90deg, 
        rgba(212, 175, 55, 0.02) 25%, 
        rgba(212, 175, 55, 0.05) 50%, 
        rgba(212, 175, 55, 0.02) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      color: rgba(212, 175, 55, 0.2);
      grid-column: 1 / -1;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    .current-time-display {
      color: rgba(212, 175, 55, 0.3);
      font-size: 0.8rem;
      margin-top: 0.25rem;
      padding: 0.25rem 0.75rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      display: inline-block;
      border: 1px solid rgba(212, 175, 55, 0.05);
    }

    .timer-card.instant-add {
      animation: diamondGlow 0.8s ease 3;
    }

    @keyframes diamondGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
      }
      50% {
        box-shadow: 0 0 60px rgba(212, 175, 55, 0.1), 0 0 100px rgba(212, 175, 55, 0.05);
      }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .form-card {
        padding: 1.5rem;
      }
      
      .timer-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Set to Current Time button styling */
    .current-time-btn {
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.1);
      color: #d4af37;
      padding: 0.3rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .current-time-btn:hover {
      background: rgba(212, 175, 55, 0.1);
      border-color: rgba(212, 175, 55, 0.2);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <span class="logo-icon">💎</span>
      <h1>Eternal Countdown</h1>
      <p>✦ Diamond Edition · Public · Real-time ✦</p>
    </header>

    <!-- Form Card -->
    <div class="form-card">
      <div class="form-title">
        <span class="icon">◆</span>
        Create New Timer
        <span class="diamond">✦</span>
      </div>
      <form id="timerForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="timerName">Timer Name *</label>
            <input type="text" id="timerName" placeholder="e.g. New Year 2026" required />
          </div>
          <div class="form-group">
            <label for="timerDesc">Description</label>
            <textarea id="timerDesc" placeholder="What are you counting down to?"></textarea>
          </div>
          
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>Timer Mode</label>
            <div class="mode-selector">
              <input type="radio" name="mode" id="modeDuration" value="duration" checked />
              <label for="modeDuration">
                <span class="icon">⏱️</span> Duration
              </label>
              <input type="radio" name="mode" id="modeDate" value="date" />
              <label for="modeDate">
                <span class="icon">📅</span> Specific Date & Time
              </label>
            </div>
          </div>

          <!-- Duration Mode -->
          <div class="form-group" style="grid-column: 1 / -1;" id="durationMode">
            <label>Duration</label>
            <div class="time-inputs">
              <div class="time-unit">
                <input type="number" id="years" min="0" value="0" step="1" />
                <label>Years</label>
              </div>
              <div class="time-unit">
                <input type="number" id="months" min="0" value="0" step="1" />
                <label>Months</label>
              </div>
              <div class="time-unit">
                <input type="number" id="days" min="0" value="0" step="1" />
                <label>Days</label>
              </div>
              <div class="time-unit">
                <input type="number" id="hours" min="0" value="0" step="1" />
                <label>Hours</label>
              </div>
              <div class="time-unit">
                <input type="number" id="minutes" min="0" value="0" step="1" />
                <label>Minutes</label>
              </div>
              <div class="time-unit">
                <input type="number" id="seconds" min="0" value="0" step="1" />
                <label>Seconds</label>
              </div>
            </div>
          </div>

          <!-- Date Mode -->
          <div class="form-group hidden" style="grid-column: 1 / -1;" id="dateMode">
            <label>Target Date & Time</label>
            <div class="datetime-wrapper">
              <input type="datetime-local" id="targetDateTime" />
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.25rem;">
              <p style="color: rgba(212,175,55,0.3); font-size: 0.8rem;">
                ⏰ The timer will count down to this exact date and time
              </p>
              <button type="button" class="current-time-btn" id="setCurrentTimeBtn">
                ◆ Set to Current Time
              </button>
            </div>
            <div class="current-time-display" id="currentTimeDisplay">
              Current Time: <span id="currentTimeText">Loading...</span>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            <span>◆</span> Start Timer <span>◆</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Timer Board -->
    <div>
      <div class="timers-header">
        <h2>◆ Active Timers</h2>
        <div class="controls">
          <span class="count" id="timerCount">0 active</span>
          <button class="refresh-btn" id="refreshBtn">
            <span class="icon">◇</span> Refresh
          </button>
        </div>
      </div>
      <div id="timerContainer" class="timer-grid">
        <div class="loading-shimmer">◆ Loading timers...</div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Configuration
    const API_BASE = window.location.origin + '/api';
    let timersData = [];
    let timerUpdateInterval;
    let isRefreshing = false;
    let currentTimeInterval;
    let pendingTimers = [];

    // Toast notification
    function showToast(message, type = 'info', duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    // Format remaining time
    function formatRemaining(ms) {
      if (ms <= 0) return '◆ 0s';
      const totalSeconds = Math.floor(ms / 1000);
      const years = Math.floor(totalSeconds / (365.25 * 24 * 60 * 60));
      let rest = totalSeconds - years * 365.25 * 24 * 60 * 60;
      const months = Math.floor(rest / (30.44 * 24 * 60 * 60));
      rest -= months * 30.44 * 24 * 60 * 60;
      const days = Math.floor(rest / (24 * 60 * 60));
      rest -= days * 24 * 60 * 60;
      const hours = Math.floor(rest / (60 * 60));
      rest -= hours * 60 * 60;
      const minutes = Math.floor(rest / 60);
      const seconds = rest % 60;

      const parts = [];
      if (years) parts.push(`${years}y`);
      if (months) parts.push(`${months}mo`);
      if (days) parts.push(`${days}d`);
      if (hours) parts.push(`${hours}h`);
      if (minutes) parts.push(`${minutes}m`);
      if (seconds || parts.length === 0) parts.push(`${seconds}s`);
      return parts.join(' ');
    }

    // Get remaining milliseconds
    function getRemainingMs(timer) {
      const now = Date.now();
      const elapsed = now - timer.startTime;
      let totalMs = 0;
      if (timer.years) totalMs += timer.years * 365.25 * 24 * 60 * 60 * 1000;
      if (timer.months) totalMs += timer.months * 30.44 * 24 * 60 * 60 * 1000;
      if (timer.days) totalMs += timer.days * 24 * 60 * 60 * 1000;
      if (timer.hours) totalMs += timer.hours * 60 * 60 * 1000;
      if (timer.minutes) totalMs += timer.minutes * 60 * 1000;
      if (timer.seconds) totalMs += timer.seconds * 1000;
      const remaining = totalMs - elapsed;
      return remaining < 0 ? 0 : remaining;
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Generate temporary ID for instant display
    function generateTempId() {
      return 'temp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    // Fetch timers from API
    async function fetchTimers() {
      try {
        const response = await fetch(`${API_BASE}/timers`);
        if (!response.ok) throw new Error('Failed to fetch timers');
        return await response.json();
      } catch (error) {
        console.error('Error fetching timers:', error);
        return [];
      }
    }

    // Create timer
    async function createTimer(timerData) {
      try {
        const response = await fetch(`${API_BASE}/create-timer`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(timerData),
        });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to create timer');
        }
        return await response.json();
      } catch (error) {
        console.error('Error creating timer:', error);
        throw error;
      }
    }

    // Cleanup finished timers
    async function cleanupFinishedTimers() {
      try {
        const response = await fetch(`${API_BASE}/cleanup`, {
          method: 'DELETE',
        });
        if (!response.ok) {
          console.error('Cleanup failed:', await response.text());
          return;
        }
        const result = await response.json();
        if (result.deletedCount > 0) {
          showToast(`◇ Removed ${result.deletedCount} finished timer${result.deletedCount > 1 ? 's' : ''}`, 'info');
        }
        return result;
      } catch (error) {
        console.error('Error during cleanup:', error);
      }
    }

    // Add timer instantly to UI
    function addTimerInstantly(timerData) {
      const tempId = generateTempId();
      const newTimer = {
        _id: tempId,
        name: timerData.name,
        description: timerData.description || '',
        startTime: timerData.startTime,
        years: timerData.years,
        months: timerData.months,
        days: timerData.days,
        hours: timerData.hours,
        minutes: timerData.minutes,
        seconds: timerData.seconds,
        _isTemp: true
      };
      
      // Add to timers data
      timersData.unshift(newTimer);
      
      // Render immediately
      renderTimers();
      
      // Highlight the new timer
      setTimeout(() => {
        const cards = document.querySelectorAll('.timer-card');
        if (cards.length > 0) {
          const firstCard = cards[0];
          firstCard.classList.add('instant-add');
          setTimeout(() => {
            firstCard.classList.remove('instant-add');
          }, 2000);
        }
      }, 100);
      
      return tempId;
    }

    // Replace temp timer with real one from server
    function replaceTempTimer(tempId, realTimer) {
      const index = timersData.findIndex(t => t._id === tempId);
      if (index !== -1) {
        timersData[index] = {
          ...realTimer,
          _isTemp: false
        };
        renderTimers();
      }
    }

    // Render timers from cached data
    function renderTimers() {
      const container = document.getElementById('timerContainer');
      const countSpan = document.getElementById('timerCount');

      if (!container) return;

      // Filter out finished timers
      const activeTimers = timersData.filter(timer => {
        const remaining = getRemainingMs(timer);
        return remaining > 0;
      });

      if (activeTimers.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="icon">◆</span>
            <h3>No Active Timers</h3>
            <p>Start the first timer above</p>
          </div>
        `;
        if (countSpan) countSpan.textContent = '0 active';
        return;
      }

      const sorted = [...activeTimers].sort((a, b) => b.startTime - a.startTime);
      let html = '';

      for (const timer of sorted) {
        const remainingMs = getRemainingMs(timer);
        const display = formatRemaining(remainingMs);
        const isFinished = remainingMs <= 0;
        const statusClass = isFinished ? 'finished' : 'active';
        const statusText = isFinished ? 'Finished' : 'Counting Down';
        const isTemp = timer._isTemp || false;

        // Calculate target date
        const targetDate = new Date(timer.startTime + 
          (timer.years || 0) * 365.25 * 24 * 60 * 60 * 1000 +
          (timer.months || 0) * 30.44 * 24 * 60 * 60 * 1000 +
          (timer.days || 0) * 24 * 60 * 60 * 1000 +
          (timer.hours || 0) * 60 * 60 * 1000 +
          (timer.minutes || 0) * 60 * 1000 +
          (timer.seconds || 0) * 1000
        );

        const tempBadge = isTemp ? '<span style="font-size:0.6rem;background:rgba(212,175,55,0.1);padding:0.1rem 0.5rem;border-radius:10px;margin-left:0.5rem;border:1px solid rgba(212,175,55,0.1);">◇ syncing...</span>' : '';

        html += `
          <div class="timer-card" data-timer-id="${timer._id}" data-temp="${isTemp}">
            <div class="timer-name">
              ${escapeHtml(timer.name)}
              <span class="id">#${timer._id?.slice(-6) || '??'}</span>
              ${tempBadge}
            </div>
            ${timer.description ? `<div class="timer-description">${escapeHtml(timer.description)}</div>` : ''}
            <div class="timer-display">
              <div class="time ${isFinished ? 'finished' : ''}" id="time-${timer._id}">${display}</div>
            </div>
            <div class="timer-meta">
              <span class="status ${statusClass}">
                <span class="dot"></span>
                ${statusText}
              </span>
              <span>Target: ${targetDate.toLocaleDateString()} ${targetDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
      if (countSpan) countSpan.textContent = `${activeTimers.length} active`;
    }

    // Update timer displays in real-time
    function updateTimersRealtime() {
      const timerCards = document.querySelectorAll('.timer-card');
      timerCards.forEach(card => {
        const timerId = card.dataset.timerId;
        const timer = timersData.find(t => t._id === timerId);
        if (timer) {
          const remainingMs = getRemainingMs(timer);
          const display = formatRemaining(remainingMs);
          const timeElement = document.getElementById(`time-${timerId}`);
          if (timeElement) {
            timeElement.textContent = display;
            // Update status if finished
            if (remainingMs <= 0 && !timeElement.classList.contains('finished')) {
              timeElement.classList.add('finished');
              const status = card.querySelector('.status');
              if (status) {
                status.className = 'status finished';
                status.innerHTML = '<span class="dot"></span> Finished';
              }
            }
          }
        }
      });

      // Update current time display
      updateCurrentTimeDisplay();
    }

    // Update current time display
    function updateCurrentTimeDisplay() {
      const currentTimeText = document.getElementById('currentTimeText');
      if (currentTimeText) {
        const now = new Date();
        currentTimeText.textContent = now.toLocaleString();
      }
    }

    // Refresh timers from server
    async function refreshTimers(showToastMessage = false) {
      const refreshBtn = document.getElementById('refreshBtn');
      if (isRefreshing) return;
      
      isRefreshing = true;
      refreshBtn.disabled = true;
      refreshBtn.classList.add('spinning');

      try {
        const newTimers = await fetchTimers();
        
        // Merge with existing timers (keep temp ones)
        const tempTimers = timersData.filter(t => t._isTemp);
        const realTimers = newTimers.filter(t => !t._isTemp);
        
        // Replace real timers with server data
        timersData = [...realTimers, ...tempTimers];
        
        renderTimers();
        
        // Also cleanup finished timers on refresh
        await cleanupFinishedTimers();
        
        if (showToastMessage) {
          showToast('◇ Timers refreshed successfully!', 'success');
        }
      } catch (error) {
        console.error('Error refreshing timers:', error);
        showToast('Failed to refresh timers', 'info');
      } finally {
        isRefreshing = false;
        refreshBtn.disabled = false;
        setTimeout(() => {
          refreshBtn.classList.remove('spinning');
        }, 500);
      }
    }

    // Set target datetime to current time + 1 minute
    function setTargetToCurrentTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 1);
      
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      const formatted = `${year}-${month}-${day}T${hours}:${minutes}`;
      document.getElementById('targetDateTime').value = formatted;
      showToast('◆ Target set to current time + 1 minute', 'info');
    }

    // Set default datetime value - NOW + 1 hour (future)
    function setDefaultDateTime() {
      const now = new Date();
      now.setHours(now.getHours() + 1);
      
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      const formatted = `${year}-${month}-${day}T${hours}:${minutes}`;
      document.getElementById('targetDateTime').value = formatted;
      updateCurrentTimeDisplay();
    }

    // Handle form submission
    async function handleSubmit(e) {
      e.preventDefault();

      const nameInput = document.getElementById('timerName');
      const descInput = document.getElementById('timerDesc');
      const submitBtn = document.getElementById('submitBtn');
      const mode = document.querySelector('input[name="mode"]:checked').value;

      const name = nameInput.value.trim();
      if (!name) {
        showToast('Please provide a timer name.', 'info');
        return;
      }

      let years = 0, months = 0, days = 0, hours = 0, minutes = 0, seconds = 0;
      let startTime = Date.now();

      if (mode === 'duration') {
        years = parseInt(document.getElementById('years').value, 10) || 0;
        months = parseInt(document.getElementById('months').value, 10) || 0;
        days = parseInt(document.getElementById('days').value, 10) || 0;
        hours = parseInt(document.getElementById('hours').value, 10) || 0;
        minutes = parseInt(document.getElementById('minutes').value, 10) || 0;
        seconds = parseInt(document.getElementById('seconds').value, 10) || 0;

        const total = years + months + days + hours + minutes + seconds;
        if (total <= 0) {
          showToast('Please set a duration greater than 0.', 'info');
          return;
        }
      } else {
        // Date mode
        const targetDateTime = document.getElementById('targetDateTime').value;
        if (!targetDateTime) {
          showToast('Please select a target date and time.', 'info');
          return;
        }

        const target = new Date(targetDateTime);
        if (isNaN(target.getTime())) {
          showToast('Invalid date/time selected.', 'info');
          return;
        }

        const now = Date.now();
        if (target.getTime() <= now) {
          showToast('Target date must be in the future.', 'info');
          return;
        }

        // Calculate duration from now to target
        const diffMs = target.getTime() - now;
        const totalSeconds = Math.floor(diffMs / 1000);
        
        years = Math.floor(totalSeconds / (365.25 * 24 * 60 * 60));
        let rest = totalSeconds - years * 365.25 * 24 * 60 * 60;
        months = Math.floor(rest / (30.44 * 24 * 60 * 60));
        rest -= months * 30.44 * 24 * 60 * 60;
        days = Math.floor(rest / (24 * 60 * 60));
        rest -= days * 24 * 60 * 60;
        hours = Math.floor(rest / (60 * 60));
        rest -= hours * 60 * 60;
        minutes = Math.floor(rest / 60);
        seconds = rest % 60;
      }

      const timerData = {
        name,
        description: descInput.value.trim() || '',
        startTime: startTime,
        years,
        months,
        days,
        hours,
        minutes,
        seconds,
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>◆</span> Starting... <span>◆</span>';

      // Add timer instantly to UI
      const tempId = addTimerInstantly(timerData);
      showToast('◇ Timer started! Syncing with server...', 'info');

      try {
        // Send to backend
        const result = await createTimer(timerData);
        
        // Replace temp timer with real one
        if (result && result.timer) {
          replaceTempTimer(tempId, result.timer);
          showToast('◆ Timer saved to server!', 'success');
        }

        // Reset form
        nameInput.value = '';
        descInput.value = '';
        document.getElementById('years').value = 0;
        document.getElementById('months').value = 0;
        document.getElementById('days').value = 0;
        document.getElementById('hours').value = 0;
        document.getElementById('minutes').value = 0;
        document.getElementById('seconds').value = 0;
      } catch (error) {
        // If server fails, keep the timer but show error
        showToast('⚠️ Timer created locally but failed to sync: ' + error.message, 'info');
        // Mark as failed sync but keep it
        const tempTimer = timersData.find(t => t._id === tempId);
        if (tempTimer) {
          tempTimer._syncFailed = true;
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>◆</span> Start Timer <span>◆</span>';
      }
    }

    // Mode switching
    function setupModeSwitching() {
      const durationMode = document.getElementById('durationMode');
      const dateMode = document.getElementById('dateMode');
      
      document.querySelectorAll('input[name="mode"]').forEach(radio => {
        radio.addEventListener('change', function() {
          if (this.value === 'duration') {
            durationMode.classList.remove('hidden');
            dateMode.classList.add('hidden');
          } else {
            durationMode.classList.add('hidden');
            dateMode.classList.remove('hidden');
          }
        });
      });
    }

    // Start real-time updates and cleanup
    function startRealTimeUpdates() {
      if (timerUpdateInterval) clearInterval(timerUpdateInterval);
      if (currentTimeInterval) clearInterval(currentTimeInterval);
      
      // Update timer displays every second (real-time countdown)
      timerUpdateInterval = setInterval(updateTimersRealtime, 1000);
      
      // Update current time display every second
      currentTimeInterval = setInterval(updateCurrentTimeDisplay, 1000);
    }

    // Init
    document.addEventListener('DOMContentLoaded', async () => {
      const form = document.getElementById('timerForm');
      form.addEventListener('submit', handleSubmit);

      const refreshBtn = document.getElementById('refreshBtn');
      refreshBtn.addEventListener('click', () => refreshTimers(true));

      const setCurrentTimeBtn = document.getElementById('setCurrentTimeBtn');
      setCurrentTimeBtn.addEventListener('click', setTargetToCurrentTime);

      setupModeSwitching();
      setDefaultDateTime();

      // Initial load from server
      const initialTimers = await fetchTimers();
      timersData = initialTimers;
      renderTimers();
      
      startRealTimeUpdates();

      // Initial cleanup on load
      setTimeout(async () => {
        await cleanupFinishedTimers();
        const freshTimers = await fetchTimers();
        timersData = freshTimers;
        renderTimers();
      }, 1000);

      // Periodically sync with server (every 10 seconds)
      setInterval(async () => {
        // Only sync if there are temp timers
        const hasTemp = timersData.some(t => t._isTemp);
        if (hasTemp) {
          // Try to sync temp timers with server
          const serverTimers = await fetchTimers();
          const tempTimers = timersData.filter(t => t._isTemp);
          
          // Check if any temp timers match server timers by name and startTime
          for (const temp of tempTimers) {
            const match = serverTimers.find(st => 
              st.name === temp.name && 
              Math.abs(st.startTime - temp.startTime) < 1000
            );
            if (match) {
              replaceTempTimer(temp._id, match);
            }
          }
        }
      }, 10000);
    });
  </script>
</body>
</html>
